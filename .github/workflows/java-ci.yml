name: Blueprint Validation
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate blueprint files
        run: |
          test -f README.md
          test -f docs/DIRECTORY_STRUCTURE.md
          test -f docs/IMPLEMENTATION_ROADMAP.md
          test -f docs/SECURITY_CHECKLIST.md
          test -f data/config/server.properties.example
          python -m json.tool data/config/database.json.example >/dev/null
          test -f ops/docker/compose.dev.yml
          test -x scripts/check-config.sh
