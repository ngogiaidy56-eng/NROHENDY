name: SQL Safety Validation
on:
  push:
  pull_request:

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate schema and public seed safety
        run: python scripts/validate_sql.py
